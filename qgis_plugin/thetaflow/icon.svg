<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Soil gradient layers -->
    <linearGradient id="topsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F10"/>
    </linearGradient>
    <linearGradient id="subsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A07840"/>
      <stop offset="100%" stop-color="#7A5B28"/>
    </linearGradient>
    <linearGradient id="deepsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4A060"/>
      <stop offset="100%" stop-color="#9C7A40"/>
    </linearGradient>
    <!-- Water/flow gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0277BD" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Circle background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#0D1F33"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="57" fill="url(#bgGrad)" stroke="#4FC3F7" stroke-width="2"/>

  <!-- Soil layers (clipped to circle) -->
  <g clip-path="url(#circle)">
    <!-- Top layer -->
    <rect x="6" y="50" width="108" height="16" fill="url(#topsoil)"/>
    <!-- Mid layer -->
    <rect x="6" y="66" width="108" height="18" fill="url(#subsoil)"/>
    <!-- Deep layer -->
    <rect x="6" y="84" width="108" height="30" fill="url(#deepsoil)"/>

    <!-- Water flow path (sinusoidal, moving downward) -->
    <path d="M38,10 C38,10 44,22 38,34 C32,46 44,56 38,66 C32,76 44,86 38,96 C38,106 38,114 38,114"
          fill="none" stroke="url(#waterGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M60,6 C60,6 66,20 60,32 C54,44 66,54 60,64 C54,74 66,84 60,94 C60,108 60,114 60,114"
          fill="none" stroke="url(#waterGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M82,10 C82,10 88,22 82,34 C76,46 88,56 82,66 C76,76 88,86 82,96 C82,106 82,114 82,114"
          fill="none" stroke="url(#waterGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

    <!-- Raindrops at top -->
    <ellipse cx="38" cy="10" rx="3.5" ry="5" fill="#4FC3F7" opacity="0.9"/>
    <ellipse cx="60" cy="6" rx="3.5" ry="5" fill="#4FC3F7" opacity="0.9"/>
    <ellipse cx="82" cy="10" rx="3.5" ry="5" fill="#4FC3F7" opacity="0.9"/>
  </g>

  <!-- Theta symbol overlay -->
  <text x="60" y="44" font-family="Georgia, serif" font-size="26" font-weight="bold"
        text-anchor="middle" fill="#E3F2FD" opacity="0.92" letter-spacing="1">θ</text>
</svg>
